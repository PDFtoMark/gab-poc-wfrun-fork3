name: POC Listener
on:
  workflow_run:
    workflows: ["Release Workflow"]
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  probe:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "wr_event=${{ github.event.workflow_run.event }}"
          echo "wr_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "wr_head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "wr_conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "SECRET_LEN=${#DEPLOY_TRIGGER_TOKEN}"
