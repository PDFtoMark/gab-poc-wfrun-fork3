name: sap-down-docker25
on:
  workflow_run:
    workflows: [sap-ci]
    types: [completed]
    branches: [docker-25]
jobs:
  probe:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "FILTERED_DOCKER25_FIRED"
          echo "upstream_event=${{ github.event.workflow_run.event }}"
          echo "upstream_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "upstream_head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "upstream_head_sha=${{ github.event.workflow_run.head_sha }}"
