name: POC Fork Down
on:
  workflow_run:
    workflows: ["POC Fork Upstream"]
    types: [completed]
    branches: [poc-attack]
permissions: {}
jobs:
  d:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          echo "forkdown fired: wr_event=${{ github.event.workflow_run.event }} wr_head_branch=${{ github.event.workflow_run.head_branch }} wr_head_repo=${{ github.event.workflow_run.head_repository.full_name }} SECRET_LEN=${#DEPLOY_TRIGGER_TOKEN}"
